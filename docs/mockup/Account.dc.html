<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<title>HaitiViral – Kont mwen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#00209F}a:hover{color:#001670}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F5F6FB; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 16px 20px; background: #FFFFFF; border-bottom: 1px solid #E5E7EF; display: flex; align-items: center; gap: 12px">
    <div style="width: 48px; height: 48px; border-radius: 50%; background: #0F172A; color: #FFFFFF; font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center">M</div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 18px; font-weight: 800">Mika Joseph</h1>
      <div style="font-size: 12px; color: #5B6478">mika@gmail.com · konekte ak Google</div>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px">
    <section style="background: #0F172A; color: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 12px; color: #CBD5E1">Nivo VIP ou</div>
          <div style="font-size: 20px; font-weight: 800">Ajan · -3%</div>
        </div>
        <span style="font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: #E2E8F0; color: #0F172A">VIP</span>
      </div>
      <div style="height: 8px; border-radius: 999px; background: #334155; overflow: hidden"><div style="width: 64%; height: 100%; border-radius: 999px; background: #FBBF24"></div></div>
      <div style="font-size: 12px; color: #CBD5E1">Depanse G 3,600 ankò pou rive <b style="color: #FBBF24">Lò (-5%)</b></div>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E5E7EF; border-radius: 16px; padding: 4px 14px">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 54px; border-bottom: 1px solid #EEF0F5">
        <span style="font-size: 14px; font-weight: 600">Lang</span>
        <div role="group" aria-label="Lang" style="display: flex; border: 1px solid #CBD2E1; border-radius: 10px; overflow: hidden">
          <button type="button" onClick="{{setKr}}" style="{{krStyle}}">Kreyòl</button>
          <button type="button" onClick="{{setFr}}" style="{{frStyle}}">Français</button>
        </div>
      </div>
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 54px; border-bottom: 1px solid #EEF0F5">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">{{t.label}}</span>
            <span style="font-size: 12px; color: #5B6478">{{t.sub}}</span>
          </div>
          <button type="button" onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" aria-label="{{t.label}}" style="flex: none; width: 60px; height: 44px; display: flex; align-items: center; justify-content: flex-end; background: none; border: none; cursor: pointer">
            <span style="{{t.track}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
          </button>
        </div>
      </sc-for>
      <a href="Notifications.dc.html" style="display: flex; justify-content: space-between; align-items: center; min-height: 54px; color: #0F172A; text-decoration: none; font-size: 14px; font-weight: 600">Enstale aplikasyon an sou telefòn ou<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></a>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E5E7EF; border-radius: 16px; padding: 4px 14px">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="5">
        <a href="{{l.href}}" style="display: flex; justify-content: space-between; align-items: center; min-height: 54px; border-bottom: 1px solid #EEF0F5; color: #0F172A; text-decoration: none; font-size: 14px; font-weight: 600">{{l.label}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></a>
      </sc-for>
      <a href="Login.dc.html" style="display: flex; align-items: center; min-height: 54px; color: #B91C1C; text-decoration: none; font-size: 14px; font-weight: 700">Dekonekte</a>
    </section>
  </main>

  <nav aria-label="Meni" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E5E7EF; padding: 6px 4px 18px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="{{t.style}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'kr', push: true, promo: false, twofa: true };
  }
  renderVals() {
    const st = this.state;
    const tab = (label, href, icon, on) => ({ label, href, icon, style: 'display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; font-size: 11px; text-decoration: none; ' + (on ? 'font-weight: 700; color: #0F172A' : 'font-weight: 600; color: #5B6478') });
    const lang = (on) => 'min-height: 38px; padding: 0 12px; border: none; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' + (on ? 'background: #0F172A; color: #FFFFFF' : 'background: #FFFFFF; color: #334155');
    const sw = (key, label, sub) => ({ label, sub, pressed: st[key] ? 'true' : 'false', toggle: () => this.setState({ [key]: !st[key] }),
      track: 'width: 48px; height: 28px; border-radius: 999px; padding: 3px; box-sizing: border-box; display: flex; ' + (st[key] ? 'background: #0F172A; justify-content: flex-end' : 'background: #CBD2E1; justify-content: flex-start') });
    return {
      krStyle: lang(st.lang === 'kr'), frStyle: lang(st.lang === 'fr'),
      setKr: () => this.setState({ lang: 'kr' }), setFr: () => this.setState({ lang: 'fr' }),
      toggles: [
        sw('push', 'Notifikasyon kòmand', 'Lè kòmand fini, ranbousman, depo'),
        sw('promo', 'Pwomosyon', 'Rabè ak nouvo sèvis'),
        sw('twofa', 'Verifikasyon an 2 etap (2FA)', 'Plis sekirite pou kont ou')
      ],
      links: [
        { label: 'Envite zanmi · touche 5%', href: 'Referral.dc.html' },
        { label: 'Sipò ak estati sèvis yo', href: 'Support.dc.html' },
        { label: 'Istwa bous mwen', href: 'Wallet.dc.html' },
        { label: 'Kondisyon itilizasyon', href: '#' },
        { label: 'Modpas ak sekirite', href: '#' }
      ],
      tabs: [
        tab('Akèy', 'Main.dc.html', 'M3 11l9-7 9 7M5 10v10h14V10', false),
        tab('Kòmande', 'NewOrder.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 8v8M8 12h8', false),
        tab('Kòmand yo', 'Orders.dc.html', 'M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1', false),
        tab('Bous', 'Wallet.dc.html', 'M2 9a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3zM2 10h20', false),
        tab('Kont', 'Account.dc.html', 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8M4 21a8 8 0 0 1 16 0', true)
      ]
    };
  }
}
</script>
</body>
</html>
